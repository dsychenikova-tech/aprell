<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Апрель</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    
    <style>
        :root {
            --bg-color: #faf9fc;
            --card-bg: #ffffff;
            --primary: #DC007B;
            --primary-dark: #b80067;
            --secondary: #2F2580;
            --text-main: #1f1a3a;
            --text-muted: #6e688a;
            --border: #e6e3f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }

        .main-wrapper {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header h1 {
            font-size: 42px;
            font-weight: 700;
            color: var(--secondary);
            letter-spacing: -0.03em;
        }

        .admin-btn {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--secondary);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .admin-btn:hover {
            border-color: var(--secondary);
            background: rgba(47, 37, 128, 0.04);
        }

        .search-box {
            width: 100%;
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 20px 28px;
            font-size: 17px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 100px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(47, 37, 128, 0.03);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(220, 0, 123, 0.1);
        }

        .results-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: calc(100vh - 250px);
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .shelf-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .shelf-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: var(--primary);
        }

        .shelf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .shelf-number {
            font-size: 18px;
            font-weight: 700;
            color: var(--secondary);
        }

        .shelf-group {
            font-size: 12px;
            background: rgba(47, 37, 128, 0.05);
            color: var(--secondary);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .drugs-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .drugs-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .drug-tag {
            background: #f4f3f9;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-main);
        }

        .drug-tag.matched {
            background: var(--primary);
            color: #ffffff;
            font-weight: 600;
            border-color: var(--primary);
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* МОДАЛЬНОЕ ОКНО АДМИНКИ */
        .admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(31, 26, 58, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-modal.active {
            display: flex;
        }

        .admin-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 750px;
            height: 85vh;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(31, 26, 58, 0.2);
            overflow: hidden;
        }

        .admin-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            flex-shrink: 0;
        }

        .admin-header h2 {
            font-size: 20px;
            color: var(--secondary);
        }

        .close-admin {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .admin-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #faf9fc;
        }

        /* КАРТОЧКИ ШКАФОВ В АДМИНКЕ (АККОРДЕОН) */
        .admin-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .admin-card-header {
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            border-radius: 14px;
            user-select: none;
        }

        .admin-card-header:hover {
            background: rgba(47, 37, 128, 0.02);
        }

        .admin-card-title {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .admin-card-title strong {
            font-size: 15px;
            color: var(--secondary);
        }

        .admin-card-title span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .admin-card-arrow {
            font-size: 12px;
            color: var(--text-muted);
            background: #f4f3f9;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .admin-card.open .admin-card-arrow {
            transform: rotate(180deg);
            background: rgba(47, 37, 128, 0.1);
            color: var(--secondary);
        }

        .admin-card-body {
            display: none;
            padding: 16px 20px 20px 20px;
            border-top: 1px solid var(--border);
            flex-direction: column;
            gap: 14px;
        }

        .admin-card.open .admin-card-body {
            display: flex;
        }

        .chips-box {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 180px;
            overflow-y: auto;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f4f3f9;
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-main);
        }

        .chip-del {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            line-height: 1;
        }

        .add-row {
            display: flex;
            gap: 8px;
        }

        .add-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            outline: none;
        }

        .add-input:focus {
            border-color: var(--primary);
        }

        .add-btn {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 0 18px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }

        .add-btn:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <header>
            <h1>Апрель</h1>
            <button class="admin-btn" id="openAdmin">Админка</button>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Введите название препарата..." autofocus>
        </div>

        <div id="results" class="results-container"></div>
    </div>

    <div class="admin-modal" id="adminModal">

                <button class="close-admin" id="closeAdmin">&times;</button>

            includeScore: true,
            threshold: 0.3,
            distance: 100,
            minMatchCharLength: 3,
            keys: ['drugs']
        };

        let fuse = new Fuse(pharmacyData, options);

        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('results');

        function renderResults(query) {
            query = query.trim();
            if (!query) {
                resultsContainer.innerHTML = "";
                return;
            }

            const searchResults = fuse.search(query);

            if (searchResults.length === 0) {
                resultsContainer.innerHTML = `<div class="no-results">Ничего не найдено</div>`;
                return;
            }

            let htmlOutput = "";
            for (let result of searchResults) {
                const shelfItem = result.item;
                const innerFuse = new Fuse(shelfItem.drugs, { threshold: 0.35, includeScore: true });
                const innerResults = innerFuse.search(query);
                const matchedDrugsList = innerResults.map(res => res.item);

                if (matchedDrugsList.length > 0) {
                    htmlOutput += createShelfHtml(shelfItem, matchedDrugsList);
                }
            }

            resultsContainer.innerHTML = htmlOutput || `<div class="no-results">Ничего не найдено</div>`;
        }

        function createShelfHtml(item, matchedDrugsList) {
            let drugsHtml = item.drugs.map(drug => {
                const isMatch = matchedDrugsList.includes(drug);
                return `<span class="drug-tag ${isMatch ? 'matched' : ''}">${drug}</span>`;
            }).join('');

            return `
                <div class="shelf-card">
                    <div class="shelf-header">
                        <div class="shelf-number">${item.shelf}</div>
                        <div class="shelf-group">${item.group}</div>
                    </div>
                    <div class="drugs-title">Препараты на шкафу:</div>
                    <div class="drugs-list">${drugsHtml}</div>
                </div>
            `;
        }

        searchInput.addEventListener('input', (e) => {
            renderResults(e.target.value);
        });

        // --- УПРАВЛЕНИЕ АДМИНКОЙ ---
        const openAdminBtn = document.getElementById('openAdmin');
        const closeAdminBtn = document.getElementById('closeAdmin');
        const adminModal = document.getElementById('adminModal');
        const adminAccordionContainer = document.getElementById('adminAccordionContainer');

        openAdminBtn.addEventListener('click', () => {
            buildAdminAccordion();
            adminModal.classList.add('active');
        });

        closeAdminBtn.addEventListener('click', () => {
            adminModal.classList.remove('active');
            fuse = new Fuse(pharmacyData, options);
            renderResults(searchInput.value);
        });

        adminModal.addEventListener('click', (e) => {
            if (e.target === adminModal) {
                adminModal.classList.remove('active');
                fuse = new Fuse(pharmacyData, options);
                renderResults(searchInput.value);
            }
        });

        function buildAdminAccordion() {
            adminAccordionContainer.innerHTML = "";
            pharmacyData.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'admin-card';

                const header = document.createElement('div');
                header.className = 'admin-card-header';
                header.innerHTML = `
                    <div class="admin-card-title">
                        <strong>${item.shelf}</strong>
                        <span>${item.group}</span>
                    </div>
                    <div class="admin-card-arrow">▼</div>
                `;

                header.addEventListener('click', () => {
                    card.classList.toggle('open');
                });

                const body = document.createElement('div');
                body.className = 'admin-card-body';

                const chipsBox = document.createElement('div');
                chipsBox.className = 'chips-box';

                function renderChips() {
                    chipsBox.innerHTML = "";
                    item.drugs.forEach((drug, idx) => {
                        const chip = document.createElement('div');
                        chip.className = 'chip';
                        chip.innerHTML = `<span>${drug}</span><button class="chip-del" title="Удалить">&times;</button>`;
                        
                        chip.querySelector('.chip-del').addEventListener('click', () => {
                            item.drugs.splice(idx, 1);
                            saveToStorage();
                            renderChips();
                        });
                        chipsBox.appendChild(chip);
                    });
                }
                renderChips();

                const addRow = document.createElement('div');
                addRow.className = 'add-row';
                addRow.innerHTML = `
                    <input type="text" class="add-input" placeholder="Добавить препарат...">
                    <button class="add-btn">+</button>
                `;

                const input = addRow.querySelector('.add-input');
                const btn = addRow.querySelector('.add-btn');

                const handleAdd = () => {
                    const val = input.value.trim();
                    if (val) {
                        item.drugs.push(val);
                        saveToStorage();
                        input.value = "";
                        renderChips();
                    }
                };

                btn.addEventListener('click', handleAdd);
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') handleAdd();
                });

                body.appendChild(chipsBox);
                body.appendChild(addRow);

                card.appendChild(header);
                card.appendChild(body);
                adminAccordionContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
